name: rumour
description: "Anonymous Room-Code Real-Time Chat App built with Flutter, BLoC, and Cloud Firestore."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Styling
  cupertino_icons: ^2.0.0

  # State Management (BLoC pattern)
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0

  # Firebase & Cloud Firestore
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0

  # Storage & Networking
  shared_preferences: ^2.5.6
  http: ^1.6.0
  intl: ^0.20.3
  uuid: ^4.6.0
  go_router: ^18.1.2
  connectivity_plus: ^7.3.2
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  firebase_auth: ^7.0.1
  share_plus: ^13.3.1
  json_annotation: ^4.12.0
  copy_with_extension: ^18.0.0
  flutter_native_splash: ^2.4.8
  app_settings: ^9.0.1
  firebase_analytics: ^13.0.1
  firebase_crashlytics: ^6.0.1
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  json_serializable: ^6.15.2
  copy_with_extension_gen: ^18.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - .env
